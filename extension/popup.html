<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Edge Table Cleaner</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #10b981;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      font-size: 13px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .pill.pro { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border-color: rgba(245, 158, 11, 0.45); }
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #cbd5e1;
    }
    label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .btn {
      padding: 6px 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: #031910; border-color: var(--accent); }
    .btn-amber { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border-color: rgba(245, 158, 11, 0.4); }
    .table-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      margin-top: 8px;
      background: #0f172a;
    }
    .table-meta { font-size: 11px; color: var(--muted); margin: 3px 0 7px; }
    .actions { display: flex; gap: 5px; flex-wrap: wrap; }
    input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: var(--text);
      font-size: 12px;
      margin-top: 6px;
    }
    .status { font-size: 11px; margin-top: 6px; color: #34d399; }
    .status.err { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">🧹 Edge Table Cleaner</div>
    <span id="tierBadge" class="pill">Free 本地版</span>
  </div>

  <div class="section">
    <div class="opts">
      <label><input type="checkbox" id="optExpand" checked /> 展开合并单元格</label>
      <label><input type="checkbox" id="optCurrency" checked /> 剥离 ¥/$/元</label>
      <label><input type="checkbox" id="optCommas" checked /> 去千分位逗号</label>
      <label><input type="checkbox" id="optFootnotes" checked /> 去角标脚注</label>
    </div>
    <button id="scanBtn" class="btn btn-primary" style="width:100%;" type="button">🔍 重新扫描当前网页表格</button>
    <div id="tablesList"></div>
  </div>

  <div class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong>📚 Pro 跨页连续暂存合并 (<span id="stagedCount">0</span> 页)</strong>
      <button id="clearStagedBtn" class="btn" style="padding:3px 7px;font-size:11px;" type="button">清空</button>
    </div>
    <p style="font-size:11px;color:var(--muted);margin:4px 0 8px;">
      内网 ERP / 招投标多页表格翻页逐页暂存，自动纵向拼接并剔除重复表头。
    </p>
    <div class="actions">
      <button id="exportMergedXlsxBtn" class="btn btn-amber" type="button">合并导出 .xlsx</button>
      <button id="exportMergedCsvBtn" class="btn" type="button">合并导出 .csv</button>
    </div>
    <div id="stageMsg" class="status"></div>
  </div>

  <div class="section" id="licenseBox">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong style="font-size:12px;">🔑 解锁 Pro 跨页合并 (¥19 / $9.9 买断)</strong>
      <a id="buyMailLink" href="#" style="color:#fbbf24;font-size:11px;text-decoration:none;">获取激活码 →</a>
    </div>
    <input type="text" id="licenseInput" placeholder="粘贴 OPC1.<payload>.<sig> 离线激活码" />
    <button id="verifyBtn" class="btn" style="width:100%;margin-top:6px;" type="button">本地 Ed25519 验签激活</button>
    <div id="licenseMsg" class="status"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
